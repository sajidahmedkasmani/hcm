[project]
name = "hcm-lite"
version = "1.0.0"
description = "AI-assisted Human Capital Management (Saylani Hackathon 2026)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: calls the hosted LLM configured by AI_API_KEY (run with: pytest -m live)"]

[tool.ruff]
line-length = 120
target-version = "py311"
