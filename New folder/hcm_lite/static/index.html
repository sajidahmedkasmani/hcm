<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCM Lite</title>
<meta name="theme-color" content="#2748F0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Onest:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  /* Daylight palette: cool lavender-grey canvas, white surfaces, cobalt action colour, sun-yellow for the assistant */
  --ink:#1C2033; --ink-2:#444B66; --muted:#5B6280; --paper:#ECEEF6; --surface:#FFFFFF; --line:#DADEEC; --line-2:#EFF1F8;
  --brand:#2748F0; --brand-ink:#1B36C2; --brand-soft:#E4E9FF; --on-brand:#FFFFFF; --danger:#C4313B; --focus:#2748F0; --sun:#FFD23F;
  /* status palette: present teal-green, late amber, absent red, leave violet. Partial days use texture, not colour alone. */
  --present:#129B73; --late:#E8A200; --absent:#D63A44; --leave:#7B5CF0; --off:#AEB4C6; --tile-ink:#14172B; --on-solid:#FFFFFF;
  --partial:repeating-linear-gradient(135deg,var(--present) 0 5px,color-mix(in srgb,var(--present) 38%,var(--surface)) 5px 9px);
  --r-sm:12px; --r-md:16px; --r-lg:22px; --side-bg:#FFFFFF; --art:#2748F0;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Onest","Segoe UI",system-ui,sans-serif;
}
[data-theme=dark]{
  color-scheme:dark;
  --ink:#E9ECFA; --ink-2:#C3C9E4; --muted:#98A0C2; --paper:#0E111F; --surface:#171B2E; --line:#2A3050; --line-2:#1F2440;
  --brand:#7088FF; --brand-ink:#A8B7FF; --brand-soft:#232C63; --on-brand:#0E111F; --danger:#FF7C85; --focus:#A8B7FF;
  --present:#25B88C; --late:#EDB020; --absent:#EE5B64; --leave:#9A82FF; --off:#5A6285; --tile-ink:#0E111F; --on-solid:#0E111F;
  --side-bg:#171B2E;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;letter-spacing:-.015em}
h1{font-size:2rem;font-weight:700} h2{font-size:1.25rem;font-weight:700} h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--brand-ink);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
table .num{font-family:var(--body);font-weight:600}
.muted{color:var(--muted)} .small{font-size:.875rem} .tiny{font-size:.8125rem}
.hidden{display:none!important}
.ico{width:22px;height:22px;flex:none;display:block}

/* ---------- shell: floating rail + sticky header ---------- */
.shell{display:grid;grid-template-columns:112px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:14px;margin:14px 0 14px 14px;height:calc(100vh - 28px);width:88px;background:var(--side-bg);border:1px solid var(--line);border-radius:28px;padding:12px 6px;display:flex;flex-direction:column;align-items:stretch;gap:12px;z-index:20}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--display);font-weight:700;font-size:1.0625rem;letter-spacing:-.01em;padding:2px 0 4px}
.brand .mark{width:46px;height:46px;border-radius:16px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:1rem;font-weight:800;letter-spacing:0;position:relative;flex:none}
.brand .mark::after{content:"";position:absolute;right:-3px;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--sun);border:2px solid var(--side-bg)}
.brand .bn{display:none;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.8125rem;color:var(--muted);letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a,.rail-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;border-radius:18px;color:var(--ink-2);text-decoration:none;font-size:.6875rem;font-weight:600;line-height:1.1;background:transparent;border:0;cursor:pointer;text-align:center;width:100%}
.nav a span,.rail-btn span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav a:hover,.rail-btn:hover{background:var(--line-2);color:var(--ink)}
.nav a.active{background:var(--brand);color:var(--on-brand)}
.rail-foot{display:flex;flex-direction:column;gap:4px;padding-top:10px;border-top:1px solid var(--line)}
#theme .i-sun{display:none} [data-theme=dark] #theme .i-moon{display:none} [data-theme=dark] #theme .i-sun{display:block}
.main{padding:0 32px 96px 18px;min-width:0}
.topbar{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0 16px;margin-bottom:6px;flex-wrap:wrap;background:color-mix(in srgb,var(--paper) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tb-left{display:flex;gap:12px;align-items:center;min-width:0}
.topbar .sub{color:var(--muted);font-size:.875rem;margin-top:2px}
.topbar .actions{display:flex;gap:10px;align-items:center}
.who{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 16px 4px 4px}
.who .av{width:36px;height:36px;border-radius:50%;background:var(--sun);color:#1C2033;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8125rem}
.who-t{display:flex;flex-direction:column;line-height:1.2;font-size:.875rem;min-width:0}
.who-t b{font-weight:600;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who-t small{color:var(--muted);font-size:.75rem}
.btn.menu-btn{display:none}

/* ---------- controls ---------- */
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:0 16px;min-height:40px;cursor:pointer;font-weight:600;font-size:.9375rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none;color:var(--ink);transition:background-color .15s,border-color .15s}
.btn:hover{border-color:var(--ink-2);background:var(--line-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-ink);border-color:var(--brand-ink);color:#fff}
[data-theme=dark] .btn.primary:hover{background:#8EA0FF;border-color:#8EA0FF;color:#0E111F}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}
.btn.danger:hover{background:color-mix(in srgb,var(--danger) 10%,var(--surface));border-color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--line-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{min-height:32px;padding:0 12px;font-size:.8125rem;border-radius:10px}
.btn.icon{width:44px;min-height:44px;padding:0;border-radius:50%}
label{display:flex;flex-direction:column;gap:6px;font-size:.8125rem;color:var(--ink-2);font-weight:600}
input,select,textarea{border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:9px 12px;min-height:42px;font-weight:400;min-width:0;font-size:.9375rem}
input:hover,select:hover,textarea:hover{border-color:var(--off)}
input:focus,select:focus,textarea:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
textarea{resize:vertical;min-height:84px}
input[type=checkbox]{width:18px;height:18px;min-height:0;accent-color:var(--brand);padding:0}
input[type=file]{padding:8px;background:var(--line-2);border-style:dashed}
.check{flex-direction:row;align-items:center;gap:10px;font-weight:400;color:var(--ink)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px 16px;align-items:end}
.form .wide{grid-column:1/-1}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters label{font-weight:600}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:22px 24px}
.panel + .panel{margin-top:18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:18px;margin-top:18px}
.grid2 .panel + .panel,.grid3 .panel + .panel{margin-top:0}
.stack{display:flex;flex-direction:column;gap:18px}
.empty{padding:32px 12px;text-align:center;color:var(--muted)}
tbody > tr > td.empty{padding:32px 12px}

/* KPI band: colour-keyed blocks, one per metric */
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.band > div{--tone:var(--ink-2);background:color-mix(in srgb,var(--tone) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--tone) 22%,var(--line));border-radius:var(--r-lg);padding:16px 18px 14px}
.band .num{font-size:2.5rem;font-weight:700;line-height:1.05;display:block;letter-spacing:-.025em}
.band .lbl{font-size:.875rem;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:8px;margin-top:6px}
.band .lbl::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--tone);flex:none}
.band .hint{font-size:.75rem;color:var(--muted);display:block;margin-top:2px}

/* Today mosaic: the one bold element on the dashboard */
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.tile{aspect-ratio:1;border-radius:15px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8125rem;color:var(--on-solid);cursor:default;position:relative}
.tile[data-s=present]{background:var(--present);color:var(--tile-ink)} .tile[data-s=late]{background:var(--late);color:var(--tile-ink)}
.tile[data-s=half_day],.tile[data-s=missing_checkout]{background:var(--partial);color:var(--tile-ink)}
.tile[data-s=absent]{background:var(--absent)} .tile[data-s=on_leave]{background:var(--leave)}
.tile[data-s=not_checked_in],.tile[data-s=upcoming]{background:transparent;color:var(--muted);border:2px dashed var(--off)}
.tile[data-s=holiday],.tile[data-s=weekend]{background:var(--off);color:var(--tile-ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:.8125rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:13px;height:13px;border-radius:5px;display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:7px;font-size:.8125rem;padding:3px 11px 3px 9px;border-radius:99px;background:var(--line-2);color:var(--ink);font-weight:600;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--off)}
.pill[data-s=present],.pill[data-s=approved],.pill[data-s=finalized],.pill[data-s=active]{background:color-mix(in srgb,var(--present) 14%,var(--surface))}
.pill[data-s=present]::before,.pill[data-s=approved]::before,.pill[data-s=finalized]::before,.pill[data-s=active]::before{background:var(--present)}
.pill[data-s=late],.pill[data-s=pending],.pill[data-s=draft],.pill[data-s=probation]{background:color-mix(in srgb,var(--late) 16%,var(--surface))}
.pill[data-s=late]::before,.pill[data-s=pending]::before,.pill[data-s=draft]::before,.pill[data-s=probation]::before{background:var(--late)}
.pill[data-s=half_day]::before,.pill[data-s=missing_checkout]::before{background:transparent;box-shadow:inset 0 0 0 2px var(--present)}
.pill[data-s=absent],.pill[data-s=rejected],.pill[data-s=exited]{background:color-mix(in srgb,var(--absent) 13%,var(--surface))}
.pill[data-s=absent]::before,.pill[data-s=rejected]::before,.pill[data-s=exited]::before{background:var(--absent)}
.pill[data-s=on_leave]{background:color-mix(in srgb,var(--leave) 14%,var(--surface))}
.pill[data-s=on_leave]::before{background:var(--leave)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -6px;padding:0 6px}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.9375rem}
th{text-align:left;font-weight:600;color:var(--muted);font-size:.8125rem;padding:8px 12px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--line-2)}
tr.click td:first-child{border-radius:12px 0 0 12px} tr.click td:last-child{border-radius:0 12px 12px 0}
td.r,th.r{text-align:right}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:14px}

/* charts */
.hbars{display:flex;flex-direction:column;gap:12px}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr minmax(48px,max-content);gap:12px;align-items:center;font-size:.875rem}
.hbar > span:last-child{white-space:nowrap;text-align:right;font-weight:600}
.hbar .track{height:14px;background:var(--line-2);border-radius:99px;overflow:hidden}
.hbar .fill{height:100%;border-radius:99px}
.cols svg{width:100%;height:190px;display:block}
.cols text{fill:var(--muted);font-size:10px;font-family:var(--body)}

/* employee home: the punch button is the hero */
.clock{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.punch{width:180px;height:180px;border-radius:50%;border:0;cursor:pointer;background:var(--brand);color:var(--on-brand);font-family:var(--display);font-size:1.4rem;font-weight:700;letter-spacing:-.01em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 0 10px var(--brand-soft),0 0 0 11px color-mix(in srgb,var(--brand) 30%,transparent);flex:none}
.punch:not(.out):not(:disabled){animation:ring 2.4s ease-out 3}
@keyframes ring{0%{box-shadow:0 0 0 10px var(--brand-soft),0 0 0 11px color-mix(in srgb,var(--brand) 30%,transparent)}60%{box-shadow:0 0 0 22px transparent,0 0 0 11px color-mix(in srgb,var(--brand) 30%,transparent)}100%{box-shadow:0 0 0 10px var(--brand-soft),0 0 0 11px color-mix(in srgb,var(--brand) 30%,transparent)}}
.punch.out{background:var(--ink);color:var(--surface);box-shadow:0 0 0 10px var(--line-2),0 0 0 11px var(--line)}
.punch:disabled{background:var(--line-2);color:var(--muted);box-shadow:0 0 0 10px var(--paper),0 0 0 11px var(--line);cursor:default}
.punch small{font-family:var(--body);font-weight:500;font-size:.8125rem;opacity:.85}
.meter{height:12px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.meter > div{height:100%;background:var(--brand);border-radius:99px}
.balances{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.bal{background:var(--line-2);border-radius:var(--r-md);padding:14px 16px}
.bal .num{font-size:2.125rem;font-weight:700;line-height:1.1;display:block}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.cal .dow{font-size:.8125rem;color:var(--muted);text-align:center;font-weight:600;padding-bottom:2px}
.cal .day{background:var(--line-2);border:0;border-left:4px solid var(--off);border-radius:14px;min-height:68px;padding:7px 8px;font-size:.75rem;display:flex;flex-direction:column;gap:2px}
.cal .day b{font-family:var(--display);font-size:.9375rem}
.cal .day[data-s=present]{border-left-color:var(--present);background:color-mix(in srgb,var(--present) 11%,var(--surface))}
.cal .day[data-s=late]{border-left-color:var(--late);background:color-mix(in srgb,var(--late) 13%,var(--surface))}
.cal .day[data-s=half_day],.cal .day[data-s=missing_checkout]{border-left-color:var(--present);border-left-style:dashed;background:color-mix(in srgb,var(--present) 7%,var(--surface))}
.cal .day[data-s=absent]{border-left-color:var(--absent);background:color-mix(in srgb,var(--absent) 11%,var(--surface))}
.cal .day[data-s=on_leave]{border-left-color:var(--leave);background:color-mix(in srgb,var(--leave) 12%,var(--surface))}
.cal .day[data-s=weekend],.cal .day[data-s=holiday]{background:transparent;border:1.5px dashed var(--line);border-left:4px solid var(--line);color:var(--muted)}

/* smart leave + AI marks */
.smart{display:flex;gap:10px}
.smart input{flex:1}
.ai-tag{display:inline-block;font-size:.75rem;color:var(--ink);background:color-mix(in srgb,var(--sun) 45%,var(--surface));border-radius:99px;padding:2px 10px;font-weight:600}

/* assistant: floating panel */
.drawer{position:fixed;top:14px;right:14px;bottom:14px;width:min(420px,calc(100vw - 28px));background:var(--surface);border:1px solid var(--line);border-radius:28px;display:flex;flex-direction:column;transform:translateX(calc(100% + 24px));visibility:hidden;transition:transform .24s cubic-bezier(.2,.8,.2,1),visibility 0s linear .24s;z-index:30;box-shadow:0 30px 80px rgba(20,24,60,.28);overflow:hidden}
.drawer.open{transform:none;visibility:visible;transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.drawer header{padding:16px 16px 14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
.ai-head{display:flex;align-items:center;gap:12px}
.ai-head .tiny{display:block;line-height:1.35;margin-top:2px}
.spark{width:40px;height:40px;border-radius:14px;background:var(--sun);color:#1C2033;display:grid;place-items:center;flex:none}
.spark .ico{width:22px;height:22px}
.msgs{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:20px;font-size:.9375rem;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--brand);color:var(--on-brand);border-bottom-right-radius:6px}
.msg.bot{align-self:flex-start;background:var(--line-2);border-bottom-left-radius:6px}
.msg .meta{display:block;margin-top:8px;font-size:.75rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 12px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 12px;font-size:.8125rem;cursor:pointer;color:var(--ink-2);font-weight:500;text-align:left}
.chip:hover{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
.composer{display:flex;gap:8px;padding:14px 16px 16px;border-top:1px solid var(--line)}
.composer input{flex:1;border-radius:99px;padding-left:16px}
.composer .btn{border-radius:99px}
.fab{position:fixed;right:24px;bottom:24px;z-index:20;border-radius:99px;padding:0 20px 0 16px;min-height:50px;background:var(--sun);border-color:var(--sun);color:#1C2033;box-shadow:0 10px 28px rgba(20,24,60,.22)}
.fab:hover{background:#FFDD66;border-color:#FFDD66;color:#1C2033}
.fab .ico{width:20px;height:20px}
.attention{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.attention h3{font-size:.875rem;margin-bottom:4px}
.attention p{font-size:.875rem;color:var(--ink-2)}
@media (max-width:640px){.attention{grid-template-columns:1fr}}

/* auth screens */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:14px;padding:14px}
.auth-form{order:1;display:flex;align-items:center;justify-content:center;padding:32px}
.auth-form form{width:min(400px,100%);display:flex;flex-direction:column;gap:16px}
.auth-form h1{font-size:2.125rem}
.auth-form .btn.primary{min-height:48px;font-size:1rem;margin-top:4px}
.auth-art{order:2;background:var(--art);color:#fff;border-radius:32px;padding:44px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;overflow:hidden}
.auth-art .brand{justify-content:flex-start}
.auth-art .brand .bn{display:block;font-size:1.25rem}
.auth-art .brand small{color:rgba(255,255,255,.75);max-width:34ch}
.auth-art .brand .mark{background:#fff;color:var(--art)}
.auth-art .brand .mark::after{border-color:var(--art)}
.auth-art h1{font-size:clamp(2.5rem,4.6vw,4.25rem);line-height:1;letter-spacing:-.035em;font-weight:800;max-width:11ch}
.auth-art .art-copy p{color:rgba(255,255,255,.82);margin-top:18px;max-width:42ch;font-size:1.0625rem}
.auth-art .mini{display:grid;grid-template-columns:repeat(12,1fr);gap:7px;max-width:520px}

<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================== utilities */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
class Raw { constructor(v) { this.v = v; } toString() { return this.v; } }
const raw = (v) => new Raw(v);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/** Tagged template that escapes every interpolation unless it is Raw (XSS-safe rendering). */
function html(strings, ...vals) {
  const part = (v) => v instanceof Raw ? v.v : Array.isArray(v) ? v.map(part).join("") : (v === false || v == null) ? "" : esc(v);
  return raw(strings.reduce((acc, s, i) => acc + s + (i < vals.length ? part(vals[i]) : ""), ""));
}
const money = (v) => "PKR " + Number(v || 0).toLocaleString("en-PK", { maximumFractionDigits: 0 });
const pct = (v) => (v ?? 0).toFixed(1).replace(/\.0$/, "") + "%";
const initials = (name) => name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const LABEL = { present: "Present", late: "Late", half_day: "Half day", absent: "Absent", on_leave: "On leave",
  missing_checkout: "Missing check-out", not_checked_in: "Not checked in", holiday: "Holiday", weekend: "Weekend",
  upcoming: "Upcoming", not_employed: "—", not_tracked: "Before go-live", pending: "Pending", approved: "Approved", rejected: "Rejected",
  cancelled: "Cancelled", draft: "Draft", finalized: "Finalized", active: "Active", probation: "Probation", exited: "Exited" };
const pill = (s) => html`<span class="pill" data-s="${s}">${LABEL[s] || s}</span>`;
const fmtDate = (iso) => iso ? new Date(iso + (iso.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—";
const fmtDT = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const monthNow = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };

let toastTimer;
function toast(msg, isErr = false) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast" + (isErr ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), isErr ? 5200 : 3200);
}

/* ============================================================== API client */
const S = { token: localStorage.getItem("hcm_token"), user: null, company: null, ai: [], openAI: false };
class ApiError extends Error { constructor(status, body) { super(body?.message || `Request failed (${status})`); this.status = status; this.body = body; } }
async function api(method, path, body, opts = {}) {
  const headers = {};
  if (S.token) headers.Authorization = "Bearer " + S.token;
  let payload = body;
  if (body && !(body instanceof FormData)) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
  const res = await fetch(path, { method, headers, body: payload });
  if (opts.blob) { if (!res.ok) throw new ApiError(res.status, await res.json().catch(() => ({}))); return res.blob(); }
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 401 && path !== "/api/auth/login") { logout(true); }
    if (res.status === 403 && data?.error === "password_change_required") { location.hash = "#/password"; }
    let msg = data?.message || data?.detail;
    if (Array.isArray(msg)) msg = msg.map((d) => `${(d.loc || []).slice(-1)[0]}: ${d.msg}`).join("; ");
    throw new ApiError(res.status, { ...(data || {}), message: msg || `Request failed (${res.status})` });
  }
  return data;
}
/** Run an action with a busy button and error toast. */
async function act(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); throw e; }
  finally { if (btn) btn.disabled = false; }
}
/** Split pasted text or a file into names: one per line (a column copied from Excel), or comma-separated on
 *  one line. From a CSV file only the first column is used. Quotes and surrounding spaces are removed. */
function parseList(text, firstCsvColumn = false) {
  const lines = /\r?\n/.test(text.trim()) ? text.split(/\r?\n/) : text.split(/[,;]/);
  return lines.map((line) => {
    let cell = line.split("\t")[0];
    if (firstCsvColumn) cell = (cell.match(/^\s*"((?:[^"]|"")*)"/)?.[1]?.replace(/""/g, '"')) ?? cell.split(",")[0];
    return cell.replace(/^["']|["']$/g, "").trim();
  }).filter(Boolean).filter((name, i) => !(i === 0 && /^(names?|departments?|designations?|titles?)$/i.test(name)));  // header row
}
// act() re-throws so callers stop; the error was already shown as a toast, so don't log it twice
window.addEventListener("unhandledrejection", (e) => { if (e.reason instanceof ApiError) e.preventDefault(); });
const formData = (form) => Object.fromEntries([...new FormData(form).entries()].map(([k, v]) => [k, typeof v === "string" ? v.trim() : v]));
const clean = (o) => Object.fromEntries(Object.entries(o).filter(([, v]) => v !== "" && v != null));
async function download(path, filename) {
  const blob = await api("GET", path, null, { blob: true });
  const url = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

/* ============================================================== session & routing */
async function logout(expired = false, { everywhere = false } = {}) {
  if (!expired && S.token) {  // revoke the token on the server, not just in this browser
    try { await api("POST", "/api/auth/logout" + (everywhere ? "?everywhere=true" : "")); } catch (_) {}
  }
  localStorage.removeItem("hcm_token"); S.token = null; S.user = null; S.ai = [];
  if (expired) toast("Your session ended. Please sign in again.", true);
  location.hash = "#/login"; render();
}
const role = () => S.user?.role;
const hasProfile = () => !!S.user?.employee_id;
const MENUS = {
  admin: [["dashboard", "Dashboard"], ["employees", "Employees"], ["attendance", "Attendance"], ["leave", "Leave"],
    ["payroll", "Payroll"], ["organization", "Organization"], ["users", "Logins"], ["announcements", "Announcements"], ["audit", "Audit log"]],
  hr: [["dashboard", "Dashboard"], ["home", "My day"], ["employees", "Employees"], ["attendance", "Attendance"],
    ["leave", "Leave"], ["payroll", "Payroll"], ["payslips", "Payslips"], ["announcements", "Announcements"], ["profile", "Profile"]],
  employee: [["home", "Home"], ["attendance", "Attendance"], ["leave", "Leave"], ["payslips", "Payslips"],
    ["announcements", "Announcements"], ["profile", "Profile"]],
};
const defaultRoute = () => role() === "employee" ? "home" : "dashboard";

window.addEventListener("hashchange", render);
async function render() {
  const route = (location.hash.replace(/^#\/?/, "") || "").split("?")[0];
  const app = $("#app");
  try {
    const status = await api("GET", "/api/setup/status");
    if (!status.initialized) return renderSetup(app);
    if (!S.token) return renderLogin(app);
    if (!S.user) {
      S.user = await api("GET", "/api/auth/me");
      S.company = S.user.company;
    }
    if (S.user.must_change_password || route === "password") return renderPassword(app);
    const allowed = MENUS[role()].map((m) => m[0]);
    const page = allowed.includes(route) ? route : defaultRoute();
    if (page !== route) { history.replaceState(null, "", "#/" + page); }
    renderShell(app, page);
    await PAGES[page]($("#page"));
  } catch (e) {
    if (e instanceof ApiError && e.status === 401) return;
    console.error(e);
    const page = $("#page");
    if (page) page.innerHTML = html`<div class="panel empty">Couldn't load this page: ${e.message}. <button class="btn sm" onclick="render()">Try again</button></div>`;
    else app.innerHTML = html`<div class="auth-form"><p>Couldn't reach the server: ${e.message}</p></div>`;
  }
}

/* ============================================================== auth screens */
function authArt() {
  const cols = ["present", "present", "late", "present", "leave", "present", "present", "absent", "present", "partial", "off", "present"];
  const tiles = Array.from({ length: 48 }, (_, i) => `<i style="--i:${i};background:var(--${cols[(i * 7 + Math.floor(i / 12) * 5 + 3) % cols.length]})"></i>`).join("");
  return html`<div class="auth-art">
    <div class="brand"><span class="mark">HC</span><span class="bn">HCM Lite<small>People operations, with an assistant that answers from your own records</small></span></div>
    <div class="art-copy"><h1>Who’s in, who’s off, who’s paid.</h1><p>Admin sets up the company, HR registers people, and every number on the dashboards comes from what happens in the app.</p></div>
    <div class="mini" aria-hidden="true">${raw(tiles)}</div></div>`;
}
function renderSetup(app) {
  app.innerHTML = html`<div class="auth">${authArt()}<div class="auth-form"><form id="f">
    <h1>Set up your company</h1><p class="muted">This creates the company profile and the Admin account. It runs once on a fresh install.</p>
    <label>Company name<input name="company_name" required minlength="2" autocomplete="organization"></label>
    <label>Your name<input name="admin_name" value="Administrator" required></label>
    <label>Admin email<input name="admin_email" type="email" required autocomplete="email"></label>
    <label>Admin password<input name="admin_password" type="password" required minlength="8" autocomplete="new-password"><span class="tiny muted">At least 8 characters with a letter and a digit.</span></label>
    <label class="check"><input type="checkbox" name="std" checked> Add standard leave types (annual 14, sick 8, casual 10, unpaid)</label>
    <button class="btn primary" type="submit">Create company</button></form></div></div>`;
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault(); const d = formData(ev.target);
    await act(ev.submitter, () => api("POST", "/api/setup", { company_name: d.company_name, admin_name: d.admin_name, admin_email: d.admin_email, admin_password: d.admin_password, create_standard_leave_types: !!d.std }), "Company created. Sign in as Admin.");
    location.hash = "#/login"; render();
  };
}
function renderLogin(app) {
  app.innerHTML = html`<div class="auth">${authArt()}<div class="auth-form"><form id="f">
    <h1>Sign in</h1><p class="muted">Use the email your Admin or HR registered for you.</p>
    <label>Email<input name="email" type="email" required autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary" type="submit">Sign in</button></form></div></div>`;
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault(); const d = formData(ev.target);
    const r = await act(ev.submitter, () => api("POST", "/api/auth/login", d));
    S.token = r.access_token; localStorage.setItem("hcm_token", S.token); S.user = null;
    location.hash = r.must_change_password ? "#/password" : "#/"; render();
  };
}
function renderPassword(app) {
  const forced = S.user?.must_change_password;
  app.innerHTML = html`<div class="auth">${authArt()}<div class="auth-form"><form id="f">
    <h1>${forced ? "Choose your own password" : "Change password"}</h1>
    <p class="muted">${forced ? "You signed in with a temporary password. Set a new one to continue." : "Your other sessions will be signed out."}</p>
    <label>Current password<input name="current_password" type="password" required autocomplete="current-password"></label>
    <label>New password<input name="new_password" type="password" required minlength="8" autocomplete="new-password"><span class="tiny muted">At least 8 characters with a letter and a digit.</span></label>
    <button class="btn primary" type="submit">Save password</button>
    ${forced ? "" : raw('<a href="#/">Back</a>')}</form></div></div>`;
  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    const r = await act(ev.submitter, () => api("POST", "/api/auth/change-password", formData(ev.target)), "Password saved");
    S.token = r.access_token; localStorage.setItem("hcm_token", S.token); S.user = null;
    location.hash = "#/"; render();
  };
}

/* ============================================================== shell */
const ICON = {
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/>',
  home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9.5h13V10"/><path d="M10 19.5v-5h4v5"/>',
  employees: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.6c2.4.3 3.7 2 4 4.4"/>',
  attendance: '<rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="m9 15 2 2 4-4"/>',
  leave: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>',
  payroll: '<path d="M4 7.5A2.5 2.5 0 0 1 6.5 5H18v3"/><rect x="3.5" y="8" width="17" height="12" rx="3.5"/><circle cx="16.5" cy="14" r="1.2"/>',
  payslips: '<path d="M6 3.5h12v17l-3-2-3 2-3-2-3 2z"/><path d="M9 8.5h6M9 12.5h6"/>',
  organization: '<rect x="4.5" y="3.5" width="10" height="17" rx="2.5"/><path d="M14.5 9.5h3a2 2 0 0 1 2 2v9h-5"/><path d="M8 8h3M8 12h3M8 16h3"/>',
  users: '<circle cx="8" cy="15" r="4"/><path d="m11 12 8-8M15.5 7.5l2.5 2.5M13 10l2 2"/>',
  announcements: '<path d="M4 10v4a1 1 0 0 0 1 1h2.5l7 4V5l-7 4H5a1 1 0 0 0-1 1z"/><path d="M18.5 9a4 4 0 0 1 0 6"/>',
  audit: '<path d="M12 3 5 6v5.5c0 4.4 2.9 7.8 7 9.5 4.1-1.7 7-5.1 7-9.5V6z"/><path d="m9 12 2.2 2.2L15.5 10"/>',
  profile: '<circle cx="12" cy="8" r="4"/><path d="M4.5 20.5c.7-4 3.5-6 7.5-6s6.8 2 7.5 6"/>',
  bell: '<path d="M6 16.5V11a6 6 0 0 1 12 0v5.5l1.5 2h-15z"/><path d="M10 21h4"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  logout: '<path d="M14 4.5h4.5A1.5 1.5 0 0 1 20 6v12a1.5 1.5 0 0 1-1.5 1.5H14"/><path d="m9.5 8-4 4 4 4M5.5 12H16"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  sparkle: '<path d="M11 3.5l1.8 5.2 5.2 1.8-5.2 1.8L11 17.5l-1.8-5.2L4 10.5l5.2-1.8z"/><path d="M19 16v4M17 18h4"/>',
};
ICON.sun = ICON.leave;
const ico = (k, cls = "") => raw(`<svg class="ico ${cls}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k] || ""}</svg>`);
const NAV_SHORT = { announcements: "Notices", organization: "Company" };  // short names fit the slim rail; the page title keeps the full name

function renderShell(app, page) {
  const u = S.user;
  if (!$(".shell", app) || app.dataset.role !== u.role) {
    app.dataset.role = u.role;
    const co = S.company?.name || "HCM Lite";
    const roleName = u.role === "hr" ? "HR" : u.role[0].toUpperCase() + u.role.slice(1);
    app.innerHTML = html`<div class="shell">
      <aside class="side" id="side">
        <div class="brand" title="${co}"><span class="mark">${initials(co)}</span><span class="bn">${co}<small>HCM Lite</small></span></div>
        <nav class="nav" id="nav" aria-label="Main"></nav>
        <div class="rail-foot">
          <button class="rail-btn" id="theme" type="button">${ico("moon", "i-moon")}${ico("sun", "i-sun")}<span class="lbl-t">Dark</span></button>
          <button class="rail-btn" id="out" type="button">${ico("logout")}<span>Sign out</span></button>
        </div>
      </aside>
      <main class="main"><header class="topbar">
        <div class="tb-left"><button class="btn menu-btn" id="menu" aria-label="Open menu">${ico("menu")}</button><div><h1 id="title"></h1><p class="sub" id="sub"></p></div></div>
        <div class="actions">
          <div class="bell"><button class="btn icon" id="bell" aria-label="Notifications">${ico("bell")}</button><span class="badge hidden" id="badge"></span><div class="dropdown hidden" id="notes"></div></div>
          <div class="who"><span class="av" aria-hidden="true">${initials(u.full_name)}</span><span class="who-t"><b>${u.full_name}</b><small>${roleName}</small></span></div>
        </div></header>
        <div id="page"></div></main></div>
      <button class="btn fab" id="fab">${ico("sparkle")}Ask the assistant</button>

function toggleTheme() {

const SUGGEST = {
  admin: ["How many employees are in Engineering?", "What is this month's attendance rate?", "Payroll summary for this month", "Which department has the most absences?"],
  hr: ["Who is on leave today?", "Who came late most often this month?", "What is this month's attendance rate?", "Show pending leave requests"],
  employee: ["How many sick leaves do I have left this year?", "How many times was I late this month?", "What is my salary?", "What happens if I come late?"],
};
function setupAI() {
  $("#chips").innerHTML = SUGGEST[role()].map((q) => html`<button class="chip" type="button">${q}</button>`.v).join("");
  $$("#chips .chip").forEach((c) => c.onclick = () => askAI(c.textContent));
  if (!S.ai.length) S.ai.push({ role: "assistant", content: `Hi ${S.user.full_name.split(" ")[0]}. Ask me about attendance, leave, payroll or company policy — I only use data you're allowed to see.`, meta: "" });
  drawMsgs();
}
function openAI(open) { $("#drawer").classList.toggle("open", open); if (open) $("#composer input").focus(); }
function drawMsgs() {
  const box = $("#msgs");
  box.innerHTML = S.ai.map((m) => html`<div class="msg ${m.role === "user" ? "user" : "bot"}">${m.content}${m.meta ? html`<span class="meta">${raw(m.meta)}</span>` : ""}</div>`.v).join("");
  box.scrollTop = box.scrollHeight;
}
async function askAI(q) {
  openAI(true);
  S.ai.push({ role: "user", content: q }); S.ai.push({ role: "assistant", content: "Thinking…", meta: "" }); drawMsgs();
  const history = S.ai.slice(0, -2).filter((m) => m.meta !== undefined || m.role === "user").slice(-6).map((m) => ({ role: m.role, content: m.content }));
  try {
    const r = await api("POST", "/api/ai/chat", { message: q, history });
    const tools = r.tool_calls.map((t) => t.tool).join(", ");
    S.ai[S.ai.length - 1] = { role: "assistant", content: r.answer, meta: html`<span class="ai-tag">${r.label}</span> ${tools ? `used ${tools}` : ""}`.v };
  } catch (e) {
    S.ai[S.ai.length - 1] = { role: "assistant", content: e.status === 429 ? e.message : "The assistant couldn't answer: " + e.message, meta: "" };
  }
  drawMsgs();
}

const opts = (items, sel, blank) => raw((blank ? `<option value="">${esc(blank)}</option>` : "") + (items || []).map((i) => `<option value="${i.id}" ${String(i.id) === String(sel) ? "selected" : ""}>${esc(i.name)}</option>`).join(""));
function modal(content, onMount) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = html`<div class="modal" role="dialog" aria-modal="true">${content}</div>`.v;
  document.body.appendChild(bg);
  const close = () => bg.remove();
  bg.addEventListener("click", (e) => { if (e.target === bg || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", function esc(e) { if (e.key === "Escape") { close(); document.removeEventListener("keydown", esc); } });
  onMount?.(bg, close);
  return close;
}

/* ============================================================== charts */
function hbars(rows, { value, label, color, fmt = (v) => v, max }) {
  if (!rows.length) return html`<div class="empty">No data for this period yet.</div>`;
  const top = max ?? Math.max(1, ...rows.map((r) => r[value]));
  return html`<div class="hbars">${rows.map((r) => html`<div class="hbar"><span>${r[label]}</span><div class="track"><div class="fill" style="width:${Math.min(100, (r[value] / top) * 100).toFixed(1)}%;background:${typeof color === "function" ? color(r) : color}"></div></div><span class="num r">${fmt(r[value])}</span></div>`)}</div>`;
}
function trendChart(trend) {
  if (!trend.length) return html`<div class="empty">The trend appears after the first working day with attendance.</div>`;
  const W = 600, H = 170, pad = 22, n = trend.length, bw = Math.max(4, (W - pad) / n - 4);
  const bars = trend.map((d, i) => {
    const h = (d.attendance_rate_pct / 100) * (H - 30); const x = pad + i * ((W - pad) / n);
    const c = d.attendance_rate_pct >= 90 ? "var(--present)" : d.attendance_rate_pct >= 75 ? "var(--late)" : "var(--absent)";
    const lbl = n <= 16 || i % Math.ceil(n / 12) === 0 ? `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${d.date.slice(8)}</text>` : "";
    return `<rect x="${x}" y="${H - 18 - h}" width="${bw}" height="${Math.max(h, 1)}" rx="3" fill="${c}"><title>${d.date}: ${d.attendance_rate_pct}%</title></rect>${lbl}`;
  }).join("");
  const grid = [50, 75, 100].map((p) => { const y = H - 18 - (p / 100) * (H - 30); return `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="0" y="${y + 3}">${p}%</text>`; }).join("");
  return html`<div class="cols"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily attendance rate">${raw(grid + bars)}</svg></div>`;
}
const LEGEND = [["present", "Present"], ["late", "Late"], ["partial", "Half day or no check-out"], ["leave", "On leave"], ["absent", "Absent"], ["none", "Not checked in"]];
const legend = () => html`<div class="legend">${LEGEND.map(([k, label]) => html`<span><i style="${k === "none" ? "border:1.5px dashed var(--off)" : "background:var(--" + k + ")"}"></i>${label}</span>`)}</div>`;

  return html`<div class="attention">${col("Late today", who("late", true), "Nobody so far")}${col("Not checked in", who("not_checked_in"), "Everyone is in")}${col("On leave", who("on_leave"), "Nobody")}</div>`;
}
async function loadWatch() {

}

/* Camera + location check-in (bonus). Face detection runs in the browser; the server checks the geofence. */
async function cameraCheckIn(done) {
  modal(html`<h2>Check in with camera</h2><p class="small muted" style="margin:6px 0 12px">We check that exactly one face is in view and that you're inside the office area. Only the result is stored — no photo.</p>
    <video id="vid" autoplay playsinline muted style="width:100%;border-radius:12px;background:#000;max-height:320px"></video>
    <p id="camstat" class="small" style="margin:10px 0">Starting camera…</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-close>Cancel</button><button class="btn primary" id="snap" disabled>Check in</button></div>`, async (root, close) => {
    const stat = $("#camstat", root), video = $("#vid", root), snap = $("#snap", root);
    let stream;
    const stop = () => stream?.getTracks().forEach((t) => t.stop());
    root.addEventListener("click", (e) => { if (e.target === root || e.target.closest("[data-close]")) stop(); });
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
      video.srcObject = stream;
      stat.textContent = "Loading face detector…";
      await loadFaceApi();
      stat.textContent = "Ready. Look at the camera and press Check in."; snap.disabled = false;
    } catch (e) { stat.textContent = "Camera check-in isn't available here (" + e.message + "). Use the regular Check in button."; return; }
    snap.onclick = async () => {
      snap.disabled = true; stat.textContent = "Detecting face and location…";
      try {
        const faces = await window.faceapi.detectAllFaces(video, new window.faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.5 }));
        const pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 12000 }));
        await api("POST", "/api/attendance/camera-check-in", { face_count: faces.length, lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy_m: pos.coords.accuracy });
        stop(); close(); toast("Checked in with camera"); done();
      } catch (e) { stat.textContent = (e.message || "Check-in failed") + " — if this keeps failing, ask HR for an attendance correction."; snap.disabled = false; }
    };
  });
}
let faceApiPromise;
function loadFaceApi() {
  if (window.faceapi) return Promise.resolve();
  faceApiPromise ??= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js";
    s.onload = () => window.faceapi.nets.tinyFaceDetector.loadFromUri("https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/").then(resolve, reject);
    s.onerror = () => reject(new Error("could not load the face detector"));
    document.head.appendChild(s);
  });
  return faceApiPromise;
}

function leaveTable(items, { mine = false, decide = false } = {}) {
  if (!items.length) return html`<div class="empty">${mine ? "You haven't applied for leave yet." : "No requests here."}</div>`;
  return html`<div class="tbl-wrap"><table><thead><tr>${mine ? "" : html`<th>Employee</th>`}<th>Type</th><th>Dates</th><th class="r">Days</th><th>Reason</th><th>Status</th><th></th></tr></thead><tbody>

}
function bindLeaveActions(box, reload) {

    const approve = b.dataset.ok === "1";

    await act(b, () => api("POST", `/api/leaves/${b.dataset.dec}/decision`, { approve, comment: comment || null }), approve ? "Leave approved" : "Leave rejected");
    reload(); refreshBadge();
  });
}

function csvImport(done) {

    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn" data-close>Close</button><button class="btn" id="dry">Check file</button><button class="btn primary hidden" id="go">Import</button></div>`, (root) => {
    const send = async (dry) => {
      const file = $("#csvf", root).files[0]; if (!file) return toast("Choose an Excel or CSV file first", true);

      return api("POST", `/api/employees/import?dry_run=${dry}`, fd);
    };
    $("#tpl", root).onclick = (ev) => act(ev.target, () => download("/api/employees/import-template.csv", "employee_import_template.csv"));

      const go = $("#go", root); go.classList.toggle("hidden", !(r.valid_rows && !r.errors.length)); go.textContent = `Import ${r.valid_rows} employee(s)`;
    };

      const r = await act(ev.target, () => send(false), "Employees imported");
      $("#rep", root).innerHTML = html`<div class="notice">Created ${r.created.length} login(s). Share these temporary passwords privately:</div><table style="margin-top:8px"><tbody>${r.created.map((c) => html`<tr><td>${c.employee_code}</td><td>${c.email}</td><td class="num"><b>${c.temporary_password}</b></td></tr>`)}</tbody></table>`.v;
      ev.target.classList.add("hidden"); done();
    };
  });
}

PAGES.payroll = async (el, openId) => {

  el.innerHTML = html`${isHR ? html`<section class="panel"><div class="panel-head"><h2>Run payroll</h2></div><form class="filters" id="pf"><label>Month<input type="month" name="month" value="${monthNow()}" required></label><button class="btn primary">Create or recalculate draft</button></form>

    <section class="panel"><h2 style="margin-bottom:12px">Payroll runs</h2>${runs.length ? html`<table><thead><tr><th>Month</th><th>Status</th><th class="r">Employees</th><th class="r">Gross</th><th class="r">Net</th><th></th></tr></thead><tbody>
      ${runs.map((r) => html`<tr><td class="num">${r.month}</td><td>${pill(r.status)}</td><td class="r num">${r.totals.employees}</td><td class="r num">${money(r.totals.gross)}</td><td class="r num">${money(r.totals.net)}</td><td class="r"><button class="btn sm" data-open="${r.id}">View</button>${isAdmin && r.status === "draft" ? html` <button class="btn sm primary" data-fin="${r.id}">Finalize</button>` : ""}</td></tr>`)}</tbody></table>` : html`<div class="empty">${isHR ? "No payroll yet. Pick a month above to create the first draft." : "HR hasn't prepared a payroll draft yet."}</div>`}</section>
    <div id="run"></div>`;
  if (isHR) $("#pf").onsubmit = async (ev) => {
    ev.preventDefault();
    const r = await act(ev.submitter, () => api("POST", "/api/payroll/runs", formData(ev.target)), "Draft ready");

};

  el.innerHTML = html`<section class="panel"><div class="panel-head"><form class="filters" id="auf"><label>Entity<input name="entity" value="${state.entity || ""}" placeholder="leave_request"></label><label>Action<select name="action">${raw(["", "create", "update", "approve", "reject", "finalize", "cancel", "deactivate", "reset_password", "delete", "import"].map((a) => `<option ${a === (state.action || "") ? "selected" : ""} value="${a}">${a || "All"}</option>`).join(""))}</select></label><button class="btn">Filter</button></form><span class="small muted">Entries can't be edited or deleted</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Entity</th><th>Before</th><th>After</th></tr></thead><tbody>
    ${d.items.map((a) => html`<tr><td class="small">${fmtDT(a.created_at)}</td><td>${a.actor_role}${a.actor_user_id ? html`<div class="tiny muted">user #${a.actor_user_id}</div>` : ""}</td><td>${a.action}</td><td>${a.entity}${a.entity_id ? " #" + a.entity_id : ""}</td>
      <td>${a.before ? html`<details><summary class="small">View</summary><pre class="json">${JSON.stringify(a.before, null, 1)}</pre></details>` : "—"}</td><td>${a.after ? html`<details><summary class="small">View</summary><pre class="json">${JSON.stringify(a.after, null, 1)}</pre></details>` : "—"}</td></tr>`)}</tbody></table></div>
    <div class="pager"><span class="small muted">${d.total} entries</span><button class="btn sm" id="prev" ${raw(state.page <= 1 ? "disabled" : "")}>Previous</button><span class="small">Page ${state.page} of ${pages}</span><button class="btn sm" id="next" ${raw(state.page >= pages ? "disabled" : "")}>Next</button></div></section>`;
  $("#auf").onsubmit = (ev) => { ev.preventDefault(); PAGES.audit(el, { ...formData(ev.target), page: 1 }); };
  $("#prev").onclick = () => PAGES.audit(el, { ...state, page: state.page - 1 });
  $("#next").onclick = () => PAGES.audit(el, { ...state, page: state.page + 1 });
};
PAGES.profile = async (el) => {
  const p = await api("GET", "/api/me/profile");
  el.innerHTML = html`<div class="grid2" style="margin-top:0"><section class="panel"><h2 style="margin-bottom:12px">${p.full_name || S.user.full_name}</h2>
      ${p.employee_code ? html`<dl class="kv"><dt>Code</dt><dd>${p.employee_code}</dd><dt>Email</dt><dd>${p.email}</dd><dt>Department</dt><dd>${p.department.name}</dd><dt>Designation</dt><dd>${p.designation?.name || "—"}</dd><dt>Joined</dt><dd>${fmtDate(p.join_date)}</dd></dl>
      <form class="form" id="pf" style="margin-top:16px"><label>Phone<input name="phone" value="${p.phone || ""}" maxlength="40"></label><label class="wide">Address<input name="address" value="${p.address || ""}" maxlength="300"></label><div><button class="btn primary">Save contact details</button></div></form>
      <p class="tiny muted" style="margin-top:8px">Other details are managed by HR.</p>` : html`<p class="muted">Admin accounts don't have an employee profile.</p>`}</section>
    <section class="panel"><h2 style="margin-bottom:12px">Security</h2><p class="small muted" style="margin-bottom:12px">Changing your password signs out your other sessions. If you signed in on a shared computer, sign out everywhere.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#/password">Change password</a><button class="btn danger" id="outall" type="button">Sign out everywhere</button></div></section></div>`;
  $("#outall").onclick = async () => { if (confirm("Sign out of HCM Lite on every device?")) await logout(false, { everywhere: true }); };
  const f = $("#pf"); if (f) f.onsubmit = async (ev) => { ev.preventDefault(); await act(ev.submitter, () => api("PATCH", "/api/me/profile", formData(ev.target)), "Contact details saved"); };
};

render();
</script>
</body>
</html>
