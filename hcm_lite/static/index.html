<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HCM Lite</title>
<meta name="theme-color" content="#14213D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Schibsted+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14213D; --ink-2:#3D4A63; --muted:#667085; --paper:#F3F5F8; --surface:#FFFFFF; --line:#DDE2EA; --line-2:#EEF1F5;
  --brand:#0E7C7B; --brand-ink:#0A5E5D; --brand-soft:#E2F1F0; --danger:#B4432F; --focus:#F0B429;
  /* status palette: validated with the dataviz CVD checker (all pairs, light + dark). Partial days use texture. */
  --present:#2A9D8F; --late:#D08C1A; --absent:#C2462E; --leave:#3B6FD8; --off:#A3ACBA; --tile-ink:#14213D;
  --partial:repeating-linear-gradient(135deg,var(--present) 0 5px,color-mix(in srgb,var(--present) 40%,var(--surface)) 5px 9px);
  --r-sm:6px; --r-md:10px; --r-lg:16px; --side-bg:#14213D;
  --display:"Schibsted Grotesk", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
}
[data-theme=dark]{
  --ink:#E8EDF5; --ink-2:#C2CBDA; --muted:#93A0B5; --paper:#0E1624; --surface:#152033; --line:#26354D; --line-2:#1C2A40;
  --brand:#35B3AE; --brand-ink:#7FD6D2; --brand-soft:#123634; --danger:#E77B66; --side-bg:#0A111C;
  --late:#C48318; --leave:#4A7FE0; --absent:#BC4430;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--paper);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);line-height:1.2;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;font-weight:700} h2{font-size:1.25rem;font-weight:600} h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--brand-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.875rem} .tiny{font-size:.8125rem}
.hidden{display:none!important}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh;background:linear-gradient(90deg,var(--side-bg) 248px,transparent 248px)}
.side{background:var(--side-bg);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh}
[data-theme=dark] .side{border-right:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:700;font-size:1.25rem;letter-spacing:-.02em;padding:0 8px}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.8125rem;opacity:.7;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{color:#D9E0EC;text-decoration:none;padding:9px 12px;border-radius:var(--r-sm);display:flex;justify-content:space-between;align-items:center}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.active{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 #5FD3CE}
.nav .count{font-size:.75rem;background:#5FD3CE;color:#0A2A2A;border-radius:99px;padding:0 7px;font-weight:700}
.me{margin-top:auto;padding:12px;border-top:1px solid rgba(255,255,255,.12);font-size:.875rem}
.me b{display:block;font-size:.95rem}
.me .row{display:flex;gap:8px;margin-top:10px}
.me button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:var(--r-sm);padding:4px 10px;cursor:pointer;font-size:.8125rem}
.main{padding:28px 36px 80px;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.topbar .actions{display:flex;gap:10px;align-items:center}
.btn.menu-btn{display:none}

/* ---------- controls ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 14px;cursor:pointer;font-weight:700;font-size:.9375rem;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-ink)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.8125rem}
label{display:flex;flex-direction:column;gap:4px;font-size:.875rem;color:var(--ink-2);font-weight:700}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 10px;font-weight:400;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:18px;height:18px}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:400}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px 16px;align-items:end}
.form .wide{grid-column:1/-1}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters label{font-weight:400}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px}
.panel + .panel{margin-top:20px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin-top:20px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:20px;margin-top:20px}
.grid2 .panel + .panel,.grid3 .panel + .panel{margin-top:0}
.stack{display:flex;flex-direction:column;gap:20px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}

/* KPI band: one row, hairline separators (not cards) */
.band{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.band > div{flex:1 1 140px;padding:16px 20px;border-left:1px solid var(--line-2)}
.band > div:first-child{border-left:0}
.band .num{font-size:2.25rem;font-weight:700;line-height:1.1;display:block}
.band .lbl{font-size:.875rem;color:var(--muted)}
.band .hint{font-size:.75rem;color:var(--muted);display:block}

/* Today mosaic — the one bold element */
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.tile{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:.8125rem;color:#fff;cursor:default;position:relative}
.tile[data-s=present]{background:var(--present);color:var(--tile-ink)} .tile[data-s=late]{background:var(--late);color:var(--tile-ink)}
.tile[data-s=half_day],.tile[data-s=missing_checkout]{background:var(--partial);color:var(--tile-ink)}
.tile[data-s=absent]{background:var(--absent)} .tile[data-s=on_leave]{background:var(--leave)}
.tile[data-s=not_checked_in],.tile[data-s=upcoming]{background:transparent;color:var(--muted);border:1.5px dashed var(--off)}
.tile[data-s=holiday],.tile[data-s=weekend]{background:var(--off)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:.8125rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;padding:2px 10px;border-radius:99px;background:var(--line-2);color:var(--ink-2);font-weight:700;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--off)}
.pill[data-s=present]::before,.pill[data-s=approved]::before,.pill[data-s=finalized]::before,.pill[data-s=active]::before{background:var(--present)}
.pill[data-s=late]::before,.pill[data-s=pending]::before,.pill[data-s=draft]::before,.pill[data-s=probation]::before{background:var(--late)}
.pill[data-s=half_day]::before,.pill[data-s=missing_checkout]::before{background:transparent;box-shadow:inset 0 0 0 2px var(--present)}
.pill[data-s=absent]::before,.pill[data-s=rejected]::before,.pill[data-s=exited]::before{background:var(--absent)}
.pill[data-s=on_leave]::before{background:var(--leave)}


/* tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9375rem}
th{text-align:left;font-weight:700;color:var(--muted);font-size:.8125rem;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--line-2)}
td.r,th.r{text-align:right}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px}

/* charts */
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:minmax(90px,140px) 1fr minmax(48px,max-content);gap:10px;align-items:center;font-size:.875rem}
.hbar > span:last-child{white-space:nowrap;text-align:right}
.hbar .track{height:12px;background:var(--line-2);border-radius:99px;overflow:hidden}
.hbar .fill{height:100%;border-radius:99px}
.cols svg{width:100%;height:180px;display:block}
.cols text{fill:var(--muted);font-size:10px;font-family:var(--body)}

/* employee home */
.clock{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.punch{width:168px;height:168px;border-radius:50%;border:0;cursor:pointer;background:var(--brand);color:#fff;font-family:var(--display);font-size:1.25rem;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 0 0 10px var(--brand-soft)}
.punch.out{background:var(--ink)} [data-theme=dark] .punch.out{background:#33415C}
.punch:disabled{background:var(--off);box-shadow:0 0 0 10px var(--line-2);cursor:default}
.punch small{font-family:var(--body);font-weight:400;font-size:.8125rem;opacity:.85}
.meter{height:10px;background:var(--line-2);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.meter > div{height:100%;background:var(--brand)}
.balances{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.bal{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.bal .num{font-size:1.75rem;font-weight:700}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .dow{font-size:.75rem;color:var(--muted);text-align:center}
.cal .day{border:1px solid var(--line-2);border-radius:8px;min-height:62px;padding:6px;font-size:.75rem;display:flex;flex-direction:column;gap:2px;border-left-width:4px}
.cal .day b{font-family:var(--display);font-size:.875rem}
.cal .day[data-s=present]{border-left-color:var(--present)} .cal .day[data-s=late]{border-left-color:var(--late)}
.cal .day[data-s=half_day],.cal .day[data-s=missing_checkout]{border-left-color:var(--present);border-left-style:dashed} .cal .day[data-s=absent]{border-left-color:var(--absent)}
.cal .day[data-s=on_leave]{border-left-color:var(--leave)}
.cal .day[data-s=weekend],.cal .day[data-s=holiday]{background:var(--line-2)}

/* smart leave */
.smart{display:flex;gap:10px}
.smart input{flex:1}
.ai-tag{display:inline-block;font-size:.75rem;color:var(--brand-ink);background:var(--brand-soft);border-radius:4px;padding:1px 6px;font-weight:700}

/* assistant drawer */
.drawer{position:fixed;top:0;right:0;height:100vh;width:min(420px,100vw);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;transform:translateX(100%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;z-index:30;box-shadow:-12px 0 40px rgba(20,33,61,.12)}
.drawer.open{transform:none;visibility:visible;transition:transform .22s ease}
.attention{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}
.attention h3{font-size:.875rem;margin-bottom:4px}
.attention p{font-size:.875rem;color:var(--ink-2)}
@media (max-width:640px){.attention{grid-template-columns:1fr}}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;font-size:.9375rem;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:var(--line-2);border-bottom-left-radius:4px}
.msg .meta{display:block;margin-top:6px;font-size:.75rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:4px 10px;font-size:.8125rem;cursor:pointer}
.chip:hover{border-color:var(--brand)}
.composer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.composer input{flex:1}
.fab{position:fixed;right:24px;bottom:24px;z-index:20;border-radius:99px;padding:12px 18px;box-shadow:0 8px 24px rgba(14,124,123,.35)}

/* auth screens */
.auth{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.auth-art{background:var(--ink);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.auth-art h1{font-size:2.75rem;max-width:12ch;letter-spacing:-.03em}
.auth-art .mini{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;max-width:360px}
.auth-art .mini i{aspect-ratio:1;border-radius:5px;display:block}
.auth-form{display:flex;align-items:center;justify-content:center;padding:32px}
.auth-form form{width:min(380px,100%);display:flex;flex-direction:column;gap:14px}

/* misc */
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:var(--r-md);z-index:50;font-size:.9375rem;max-width:min(560px,92vw)}
[data-theme=dark] .toast{background:#33415C}
.toast.err{background:var(--danger)}
.modal-bg{position:fixed;inset:0;background:rgba(14,22,36,.45);display:grid;place-items:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(760px,100%);max-height:90vh;overflow-y:auto;padding:22px 24px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:8px 14px;cursor:pointer;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--brand)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;font-size:.9375rem}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.bulk{margin-top:12px;border:1px dashed var(--line);border-radius:var(--r-md);padding:8px 12px}
.bulk summary{cursor:pointer;font-weight:700;font-size:.875rem;color:var(--brand-ink)}
.bulk form{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bulk textarea{min-height:120px;font-size:.875rem}
.bulk .row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.notice{background:var(--brand-soft);border-radius:var(--r-md);padding:12px 14px;font-size:.9375rem}
.notice.warn{background:#FFF4E5;color:#7A4B00} [data-theme=dark] .notice.warn{background:#3A2C12;color:#F5D7A1}
.cam{position:relative;border-radius:var(--r-lg);overflow:hidden;background:#0B1220;aspect-ratio:4/3;max-height:340px;margin:0 auto}
.cam video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block}
.cam-guide{position:absolute;left:50%;top:48%;width:46%;aspect-ratio:3/4;transform:translate(-50%,-50%);border:3px dashed rgba(255,255,255,.75);border-radius:50%;pointer-events:none}
.cam-progress{position:absolute;left:0;bottom:0;height:5px;width:0;background:var(--brand);transition:width .12s linear}
.cam-msg{min-height:2.6em} .cam-msg.err{color:var(--danger)}
.punch svg{width:26px;height:26px;margin-bottom:2px}
.face-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.warn{background:color-mix(in srgb,var(--late) 15%,var(--surface));border-radius:var(--r-md);padding:10px 14px;font-size:.875rem}
pre.json{font-size:.75rem;background:var(--line-2);padding:8px;border-radius:6px;overflow-x:auto;max-width:420px;margin:0}
.bell{position:relative}
.bell .badge{position:absolute;top:-6px;right:-6px;background:var(--absent);color:#fff;border-radius:99px;font-size:.6875rem;padding:0 6px;font-weight:700}
.dropdown{position:absolute;right:0;top:44px;width:340px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 12px 32px rgba(20,33,61,.14);z-index:25;max-height:420px;overflow-y:auto}
.dropdown .item{padding:10px 14px;border-bottom:1px solid var(--line-2);font-size:.875rem}
.dropdown .item.unread{background:var(--brand-soft)}

@media (max-width:980px){
  .grid2,.grid3{grid-template-columns:1fr}
  .auth{grid-template-columns:1fr} .auth-art{display:none}
}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;transform:translateX(-100%);transition:transform .2s;z-index:35}
  .side.open{transform:none}
  .shell{background:none}
  .btn.menu-btn{display:inline-flex}
  .cal .day span{display:none} .cal .day{min-height:40px;padding:4px}
  .main{padding:18px 16px 90px}
  .band .num{font-size:1.75rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ============================================================== utilities */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
class Raw { constructor(v) { this.v = v; } toString() { return this.v; } }
const raw = (v) => new Raw(v);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
/** Tagged template that escapes every interpolation unless it is Raw (XSS-safe rendering). */
function html(strings, ...vals) {
  const part = (v) => v instanceof Raw ? v.v : Array.isArray(v) ? v.map(part).join("") : (v === false || v == null) ? "" : esc(v);
  return raw(strings.reduce((acc, s, i) => acc + s + (i < vals.length ? part(vals[i]) : ""), ""));
}
const money = (v) => "PKR " + Number(v || 0).toLocaleString("en-PK", { maximumFractionDigits: 0 });
const pct = (v) => (v ?? 0).toFixed(1).replace(/\.0$/, "") + "%";
const initials = (name) => name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
const LABEL = { present: "Present", late: "Late", half_day: "Half day", absent: "Absent", on_leave: "On leave",
  missing_checkout: "Missing check-out", not_checked_in: "Not checked in", holiday: "Holiday", weekend: "Weekend",
  upcoming: "Upcoming", not_employed: "—", not_tracked: "Before go-live", pending: "Pending", approved: "Approved", rejected: "Rejected",
  cancelled: "Cancelled", draft: "Draft", finalized: "Finalized", active: "Active", probation: "Probation", exited: "Exited" };
const pill = (s) => html`<span class="pill" data-s="${s}">${LABEL[s] || s}</span>`;
const fmtDate = (iso) => iso ? new Date(iso + (iso.length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) : "—";
const fmtDT = (iso) => iso ? new Date(iso).toLocaleString("en-GB", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
const monthNow = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; };

let toastTimer;
function toast(msg, isErr = false) {
  const t = $("#toast");
  t.textContent = msg; t.className = "toast" + (isErr ? " err" : "");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.add("hidden"), isErr ? 5200 : 3200);
}

/* ============================================================== API client */
const S = { token: localStorage.getItem("hcm_token"), user: null, company: null, ai: [], openAI: false };
class ApiError extends Error { constructor(status, body) { super(body?.message || `Request failed (${status})`); this.status = status; this.body = body; } }
async function api(method, path, body, opts = {}) {
  const headers = {};
  if (S.token) headers.Authorization = "Bearer " + S.token;
  let payload = body;
  if (body && !(body instanceof FormData)) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
  const res = await fetch(path, { method, headers, body: payload });
  if (opts.blob) { if (!res.ok) throw new ApiError(res.status, await res.json().catch(() => ({}))); return res.blob(); }
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 401 && path !== "/api/auth/login") { logout(true); }
    if (res.status === 403 && data?.error === "password_change_required") { location.hash = "#/password"; }
    let msg = data?.message || data?.detail;
    if (Array.isArray(msg)) msg = msg.map((d) => `${(d.loc || []).slice(-1)[0]}: ${d.msg}`).join("; ");
    throw new ApiError(res.status, { ...(data || {}), message: msg || `Request failed (${res.status})` });
  }
  return data;
}
/** Run an action with a busy button and error toast. */
async function act(btn, fn, okMsg) {
  if (btn) btn.disabled = true;
  try { const r = await fn(); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); throw e; }
  finally { if (btn) btn.disabled = false; }
}
/** Split pasted text or a file into names: one per line (a column copied from Excel), or comma-separated on
 *  one line. From a CSV file only the first column is used. Quotes and surrounding spaces are removed. */
function parseList(text, firstCsvColumn = false) {
  const lines = /\r?\n/.test(text.trim()) ? text.split(/\r?\n/) : text.split(/[,;]/);
  return lines.map((line) => {
    let cell = line.split("\t")[0];
    if (firstCsvColumn) cell = (cell.match(/^\s*"((?:[^"]|"")*)"/)?.[1]?.replace(/""/g, '"')) ?? cell.split(",")[0];
    return cell.replace(/^["']|["']$/g, "").trim();
  }).filter(Boolean).filter((name, i) => !(i === 0 && /^(names?|departments?|designations?|titles?)$/i.test(name)));  // header row
}

async function render() {
  const route = (location.hash.replace(/^#\/?/, "") || "").split("?")[0];
  const app = $("#app");
  try {
    const status = await api("GET", "/api/setup/status");
    if (!status.initialized) return renderSetup(app);
    if (!S.token) return renderLogin(app);
    if (!S.user) {
      S.user = await api("GET", "/api/auth/me");
      S.company = S.user.company;

    if (S.user.must_change_password || route === "password") return renderPassword(app);
    const allowed = MENUS[role()].map((m) => m[0]);

    renderShell(app, page);

    if (e instanceof ApiError && e.status === 401) return;

function hbars(rows, { value, label, color, fmt = (v) => v, max }) {
  if (!rows.length) return html`<div class="empty">No data for this period yet.</div>`;
  const top = max ?? Math.max(1, ...rows.map((r) => r[value]));
  return html`<div class="hbars">${rows.map((r) => html`<div class="hbar"><span>${r[label]}</span><div class="track"><div class="fill" style="width:${Math.min(100, (r[value] / top) * 100).toFixed(1)}%;background:${typeof color === "function" ? color(r) : color}"></div></div><span class="num r">${fmt(r[value])}</span></div>`)}</div>`;
}
function trendChart(trend) {
  if (!trend.length) return html`<div class="empty">The trend appears after the first working day with attendance.</div>`;
  const W = 600, H = 170, pad = 22, n = trend.length, bw = Math.max(4, (W - pad) / n - 4);
  const bars = trend.map((d, i) => {
    const h = (d.attendance_rate_pct / 100) * (H - 30); const x = pad + i * ((W - pad) / n);
    const c = d.attendance_rate_pct >= 90 ? "var(--present)" : d.attendance_rate_pct >= 75 ? "var(--late)" : "var(--absent)";
    const lbl = n <= 16 || i % Math.ceil(n / 12) === 0 ? `<text x="${x + bw / 2}" y="${H - 4}" text-anchor="middle">${d.date.slice(8)}</text>` : "";
    return `<rect x="${x}" y="${H - 18 - h}" width="${bw}" height="${Math.max(h, 1)}" rx="3" fill="${c}"><title>${d.date}: ${d.attendance_rate_pct}%</title></rect>${lbl}`;
  }).join("");
  const grid = [50, 75, 100].map((p) => { const y = H - 18 - (p / 100) * (H - 30); return `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="3 4"/><text x="0" y="${y + 3}">${p}%</text>`; }).join("");
  return html`<div class="cols"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Daily attendance rate">${raw(grid + bars)}</svg></div>`;
}

/* ============================================================== camera attendance
   Thin client: the browser only captures a few frames and a GPS fix. The server (dlib) decides — exactly one
   face, the face enrolled for this account, inside the office radius and, if Admin turned it on, a blink.
   Frames are checked and discarded; only the outcome is stored. */
const CAMERA_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const CAM_PLAN = {               // frames to send, gap between them (ms), longest side (px)
  enroll: { n: 5, gap: 350, side: 640 },
  verify: { n: 3, gap: 250, side: 640 },
  blink: { n: 14, gap: 140, side: 480 },   // ~2 s — long enough to catch one blink
};
const CAM_HINT = {
  outside_geofence: "Camera attendance works only inside the office area.",
  low_gps_accuracy: "Turn on precise location (and Wi-Fi) and try again.",
  no_face: "Centre your face in the oval with light in front of you.",
  multiple_faces: "Only the person checking in should be in the picture.",
  no_blink: "Look at the camera and blink once while the bar fills.",
  face_not_steady: "Hold the phone or laptop still and keep your face in the oval.",
  face_engine_unavailable: "Face verification isn't installed on the server — tell your administrator.",
};
const RETRY_HELP = new Set(["face_mismatch", "outside_geofence", "low_gps_accuracy", "no_office_location", "face_engine_unavailable"]);

function cameraUnsupported() {
  if (!window.isSecureContext) return "The camera works only over HTTPS (or on localhost). Open the app's https:// address.";
  if (!navigator.mediaDevices?.getUserMedia) return "This browser can't use the camera. Try a current Chrome, Edge, Safari or Firefox.";
  return null;
}
async function grabFrames(video, { n, gap, side }, onFrame) {
  const scale = Math.min(1, side / Math.max(video.videoWidth, video.videoHeight));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(video.videoWidth * scale); canvas.height = Math.round(video.videoHeight * scale);
  const g = canvas.getContext("2d"), frames = [];
  for (let i = 0; i < n; i++) {
    if (i) await new Promise((r) => setTimeout(r, gap));
    g.drawImage(video, 0, 0, canvas.width, canvas.height);
    frames.push(canvas.toDataURL("image/jpeg", 0.85));
    onFrame?.(i + 1, n);
  }
  return frames;
}
function currentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("This browser can't share your location."));
    navigator.geolocation.getCurrentPosition(
      (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude, accuracy_m: p.coords.accuracy }),
      (e) => reject(new Error(e.code === 1 ? "Location permission was denied — allow location for this site, then try again." : `Couldn't get your location (${e.message}).`)),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  });
}

/** kind: "in" | "out" | "enroll". employeeId + name = HR enrolling someone in person. */
function cameraModal({ kind, employeeId = null, name = "", requireBlink = false, done }) {
  const enroll = kind === "enroll", byHR = enroll && employeeId != null;
  const plan = enroll ? CAM_PLAN.enroll : requireBlink ? CAM_PLAN.blink : CAM_PLAN.verify;
  const title = byHR ? `Enroll ${name}'s face` : enroll ? "Set up face check-in" : kind === "in" ? "Check in with camera" : "Check out with camera";
  const action = enroll ? "Capture" : kind === "in" ? "Check in" : "Check out";
  const intro = byHR ? `Ask ${name} to sit in front of this camera. Five quick pictures are taken to learn their face.`
    : enroll ? "One time only: five quick pictures teach the system your face. After that you check in and out by looking at the camera. To change it later, ask HR."
    : `We confirm it's you and that you're within the office area${requireBlink ? ". Blink once while the bar fills" : ""}.`;
  modal(html`<h2>${title}</h2><p class="small muted" style="margin:6px 0 12px">${intro}</p>
    <div class="cam"><video id="vid" autoplay playsinline muted></video><div class="cam-guide" aria-hidden="true"></div><div class="cam-progress" id="camprog"></div></div>
    <p id="camstat" class="small cam-msg" role="status" aria-live="polite" style="margin:10px 0 4px">Starting camera…</p>
    <p class="tiny muted">Pictures are sent to the server only to check the face and are deleted straight away. ${enroll ? "Only a numeric face signature is kept, never a photo." : "Only the result is kept: match score, distance from the office and the time."}</p>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" data-close>Cancel</button><button class="btn primary" id="snap" disabled>${action}</button></div>`, async (root, close) => {
    const stat = $("#camstat", root), video = $("#vid", root), snap = $("#snap", root), bar = $("#camprog", root);
    let stream;
    const stop = () => stream?.getTracks().forEach((t) => t.stop());
    new MutationObserver((_, obs) => { if (!root.isConnected) { stop(); obs.disconnect(); } }).observe(document.body, { childList: true });
    const say = (msg, err = false) => { stat.className = "small cam-msg" + (err ? " err" : ""); stat.innerHTML = msg; };
    const unsupported = cameraUnsupported();
    if (unsupported) return say(esc(unsupported), true);
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
      video.srcObject = stream;
      await new Promise((r) => (video.readyState >= 2 ? r() : video.addEventListener("loadeddata", r, { once: true })));
    } catch (e) {
      return say(esc(e.name === "NotAllowedError" ? "Camera permission was denied — allow the camera for this site (address bar), then try again." : `Couldn't start the camera (${e.message}).`), true);
    }
    if (!root.isConnected) return stop();
    let where = enroll ? null : currentPosition();   // GPS starts while the person gets ready
    where?.catch(() => {});
    say(esc(`Centre the face in the oval, in good light${requireBlink && !enroll ? ", and blink once during capture" : ""}. Then press ${action}.`));
    snap.disabled = false;
    snap.onclick = async () => {
      snap.disabled = true;
      try {
        say(requireBlink && !enroll ? "Capturing — <b>blink now</b>…" : "Capturing — hold still…");
        const frames = await grabFrames(video, plan, (i, n) => { bar.style.width = `${(i / n) * 100}%`; });
        let r;
        if (enroll) {
          say("Checking the pictures…");
          r = await api("POST", byHR ? `/api/employees/${employeeId}/face` : "/api/attendance/face/enroll", { frames });
        } else {
          say("Getting your location…");
          const pos = await where;
          say("Verifying face and location…");
          r = await api("POST", "/api/attendance/camera", { action: kind, frames, ...pos });
        }
        stop(); close();
        toast(byHR ? `${name}'s face is enrolled` : enroll ? "Face set up — now check in with the camera" : kind === "in" ? `Checked in at ${r.check_in}` : `Checked out at ${r.check_out}`);
        done?.(r);
      } catch (e) {
        bar.style.width = "0";
        if (!enroll) { where = currentPosition(); where.catch(() => {}); }   // fresh fix for the retry
        const code = e.body?.error;
        const help = CAM_HINT[code] ? ` ${esc(CAM_HINT[code])}` : "";
        const fallback = !enroll && RETRY_HELP.has(code) ? ' Still stuck? <a href="#/attendance">Request an attendance correction</a> and HR will review it.' : "";
        say(`<b>${esc(e.message)}</b>${help}${fallback}`, true);
        snap.disabled = false; snap.textContent = "Try again";
      }
    };
  });
}

function leaveTable(items, { mine = false, decide = false } = {}) {

}
function bindLeaveActions(box, reload) {

    ev.preventDefault();
    const r = await act(ev.submitter, () => api("POST", "/api/payroll/runs", formData(ev.target)), "Draft ready");
    if (r.skipped?.length) toast(`${r.skipped.length} employee(s) skipped: no salary structure`, true);
    PAGES.payroll(el, r.id);
  };
  $$("[data-open]", el).forEach((b) => b.onclick = () => showRun(b.dataset.open));
  $$("[data-fin]", el).forEach((b) => b.onclick = async () => {
    if (!confirm("Finalize this month? Payslips are released to employees and the month is locked.")) return;
    await act(b, () => api("POST", `/api/payroll/runs/${b.dataset.fin}/finalize`), "Payroll finalized and locked"); PAGES.payroll(el, b.dataset.fin);
  });
  if (openId) showRun(openId);
};
async function showRun(id) {
  const r = await api("GET", "/api/payroll/runs/" + id);
  $("#run").innerHTML = html`<section class="panel" style="margin-top:20px"><div class="panel-head"><h2>${r.month} ${pill(r.status)}</h2><span class="small muted">${r.working_days} working days</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>Employee</th><th class="r">Gross</th><th class="r">Eligible days</th><th class="r">Deduction days</th><th class="r">Deductions</th><th class="r">Tax</th><th class="r">Net</th><th></th></tr></thead><tbody>
    ${r.payslips.map((p) => html`<tr><td>${p.employee_name}<div class="tiny muted">absent ${p.absent_days}, unpaid ${p.unpaid_leave_days}, half ${p.half_days}${p.late_penalty_days ? `, late penalty ${p.late_penalty_days}` : ""}</div></td><td class="r num">${money(p.prorated_gross)}</td><td class="r num">${p.eligible_days}</td><td class="r num">${p.deduction_days}</td><td class="r num">${money(p.deductions)}</td><td class="r num">${money(p.tax)}</td><td class="r num"><b>${money(p.net)}</b></td><td class="r"><button class="btn sm" data-pdf="${p.id}" data-name="${p.employee_code}">PDF</button></td></tr>`)}
    <tr><td><b>Total</b></td><td class="r num"><b>${money(r.totals.gross)}</b></td><td></td><td></td><td class="r num">${money(r.totals.deductions)}</td><td class="r num">${money(r.totals.tax)}</td><td class="r num"><b>${money(r.totals.net)}</b></td><td></td></tr></tbody></table></div></section>`.v;
  $$("[data-pdf]").forEach((b) => b.onclick = () => act(b, () => download(`/api/payslips/${b.dataset.pdf}/pdf`, `payslip_${b.dataset.name}_${r.month}.pdf`)));
}
PAGES.payslips = async (el) => {
  const slips = await api("GET", "/api/payslips" + (hasProfile() && role() === "hr" ? "?employee_id=" + S.user.employee_id : ""));
  el.innerHTML = html`<section class="panel">${slips.length ? html`<table><thead><tr><th>Month</th><th class="r">Gross</th><th class="r">Deductions</th><th class="r">Tax</th><th class="r">Net</th><th></th></tr></thead><tbody>${slips.map((p) => html`<tr><td class="num">${p.month}</td><td class="r num">${money(p.prorated_gross)}</td><td class="r num">${money(p.deductions)}</td><td class="r num">${money(p.tax)}</td><td class="r num"><b>${money(p.net)}</b></td><td class="r"><button class="btn sm" data-pdf="${p.id}" data-m="${p.month}">Download PDF</button></td></tr>`)}</tbody></table>` : html`<div class="empty">No payslips yet. They appear here after Admin finalizes a month.</div>`}</section>`;
  $$("[data-pdf]", el).forEach((b) => b.onclick = () => act(b, () => download(`/api/payslips/${b.dataset.pdf}/pdf`, `payslip_${b.dataset.m}.pdf`)));
};

/* ============================================================== organization (Admin) */
PAGES.organization = async (el) => {
  const [s, depts, desigs, types, hols] = await Promise.all([api("GET", "/api/settings"), api("GET", "/api/departments"), api("GET", "/api/designations"), api("GET", "/api/leave-types"), api("GET", "/api/holidays")]);
  DEPTS = depts; DESIGS = desigs; LTYPES = types;
  const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
  const named = (title, items, path) => html`<section class="panel"><h2 style="margin-bottom:12px">${title}</h2>
    <form class="filters" data-add="${path}"><input name="name" required placeholder="Name" aria-label="${title} name"><button class="btn">Add</button></form>
    <details class="bulk"><summary>Add many at once</summary><form data-bulk="${path}" data-label="${title.toLowerCase()}">
      <textarea name="names" placeholder="One per line — paste a column straight from Excel or Google Sheets" aria-label="${title}, one per line"></textarea>
      <div class="row"><input type="file" accept=".csv,.txt,text/csv,text/plain" aria-label="Load ${title.toLowerCase()} from a file"><span class="small muted" data-count>0 names</span></div>
      <div><button class="btn primary">Add all</button> <span class="tiny muted">Names that already exist are skipped.</span></div></form></details>
    <table style="margin-top:10px"><tbody>${items.length ? items.map((i) => html`<tr><td>${i.name}</td><td class="r"><button class="btn sm danger" data-del="${path}/${i.id}">Remove</button></td></tr>`) : html`<tr><td class="muted small">None yet.</td></tr>`}</tbody></table></section>`;
  el.innerHTML = html`<section class="panel"><div class="panel-head"><h2>Company settings</h2><span class="small muted">Apply to new attendance records only</span></div><form class="form" id="sf">
      <label>Company name<input name="name" value="${s.name}" required></label><label>Office start<input type="time" name="office_start" value="${s.office_start}" required></label>
      <label>Grace time (minutes)<input type="number" name="grace_minutes" min="0" max="120" value="${s.grace_minutes}"></label><label>Half day under (hours)<input type="number" name="half_day_hours" step="0.5" min="1" max="12" value="${s.half_day_hours}"></label>
      <fieldset class="wide" style="border:0;padding:0;margin:0"><legend class="small" style="font-weight:700;color:var(--ink-2);margin-bottom:4px">Weekend</legend><div style="display:flex;gap:14px;flex-wrap:wrap">${days.map((d, i) => html`<label class="check"><input type="checkbox" name="wd${i}" ${raw(s.weekend_days.includes(i) ? "checked" : "")}>${d}</label>`)}</div></fieldset>
      <label>Office latitude<input type="number" step="any" name="office_lat" value="${s.office_lat ?? ""}"></label><label>Office longitude<input type="number" step="any" name="office_lng" value="${s.office_lng ?? ""}"></label>
      <label>Attendance method<select name="attendance_mode"><option value="camera" ${raw(s.attendance_mode === "camera" ? "selected" : "")}>Camera: face + location</option><option value="web" ${raw(s.attendance_mode === "web" ? "selected" : "")}>Web buttons (no camera)</option></select></label>
      <label>Office radius (m)<input type="number" name="office_radius_m" min="10" max="5000" value="${s.office_radius_m}"></label>
      <label class="check wide"><input type="checkbox" name="require_blink" ${raw(s.require_blink ? "checked" : "")}> Require a blink (stops someone holding up a photo; takes about 2 seconds longer)</label>
      ${s.attendance_mode === "camera" && (s.office_lat == null || s.office_lng == null) ? html`<p class="notice warn small wide">Camera attendance needs the office location: enter it below or press "Use my current location" while at the office, then save.</p>` : ""}
      <label class="check wide"><input type="checkbox" name="late_penalty_enabled" ${raw(s.late_penalty_enabled ? "checked" : "")}> Late penalty: 3 lates = 0.5 day</label>
      <div class="wide" style="display:flex;gap:8px"><button class="btn primary">Save settings</button><button type="button" class="btn" id="loc">Use my current location</button></div></form></section>
    <div class="grid2">${named("Departments", depts, "/api/departments")}${named("Designations", desigs, "/api/designations")}
      <section class="panel"><h2 style="margin-bottom:12px">Leave types and yearly quotas</h2>
        <table><thead><tr><th>Type</th><th class="r">Days per year</th><th>Paid</th></tr></thead><tbody>${types.map((t) => html`<tr><td>${t.name}</td><td class="r"><input type="number" min="0" style="width:84px" value="${t.yearly_quota ?? ""}" placeholder="Unlimited" data-quota="${t.id}" aria-label="${t.name} quota"></td><td>${t.is_paid ? "Yes" : "No"}</td></tr>`)}</tbody></table>
        ${types.length ? "" : html`<button class="btn" id="std" style="margin-top:10px">Add standard leave types</button>`}
        <form class="form" id="ltf" style="margin-top:14px"><label>Code<input name="code" required placeholder="maternity"></label><label>Name<input name="name" required></label><label>Days per year<input name="yearly_quota" type="number" min="0"></label><label class="check"><input type="checkbox" name="is_paid" checked> Paid</label><div><button class="btn">Add type</button></div></form></section>
      <section class="panel"><h2 style="margin-bottom:12px">Public holidays</h2><form class="filters" id="hf"><input type="date" name="date" required aria-label="Holiday date"><input name="name" required placeholder="Holiday name" aria-label="Holiday name"><button class="btn">Add</button></form>
        <table style="margin-top:10px"><tbody>${hols.length ? hols.map((h) => html`<tr><td class="small">${fmtDate(h.date)}</td><td>${h.name}</td><td class="r"><button class="btn sm danger" data-del="/api/holidays/${h.id}">Remove</button></td></tr>`) : html`<tr><td class="muted small">No holidays added.</td></tr>`}</tbody></table></section></div>`;
  const reload = () => PAGES.organization(el);
  $("#sf").onsubmit = async (ev) => {
    ev.preventDefault(); const d = formData(ev.target);
    const body = { name: d.name, office_start: d.office_start, grace_minutes: Number(d.grace_minutes), half_day_hours: Number(d.half_day_hours), office_radius_m: Number(d.office_radius_m),
      weekend_days: days.map((_, i) => i).filter((i) => d["wd" + i]), late_penalty_enabled: !!d.late_penalty_enabled,
      office_lat: d.office_lat === "" ? null : Number(d.office_lat), office_lng: d.office_lng === "" ? null : Number(d.office_lng),
      attendance_mode: d.attendance_mode, require_blink: !!d.require_blink };
    await act(ev.submitter, () => api("PUT", "/api/settings", body), "Settings saved"); reload();
  };
  $("#loc").onclick = () => navigator.geolocation?.getCurrentPosition((p) => { $("#sf").office_lat.value = p.coords.latitude.toFixed(6); $("#sf").office_lng.value = p.coords.longitude.toFixed(6); toast("Location filled in — press Save settings"); }, (e) => toast("Couldn't read your location: " + e.message, true));
  $$("[data-add]", el).forEach((f) => f.onsubmit = async (ev) => { ev.preventDefault(); await act(ev.submitter, () => api("POST", f.dataset.add, formData(f)), "Added"); reload(); });
  $$("[data-bulk]", el).forEach((f) => {
    let fromFile = false;
    const count = () => { const n = parseList(f.names.value, fromFile).length; $("[data-count]", f).textContent = `${n} name${n === 1 ? "" : "s"}`; };
    f.names.oninput = () => { fromFile = false; count(); };
    $("input[type=file]", f).onchange = async (ev) => { const file = ev.target.files[0]; if (!file) return; f.names.value = await file.text(); fromFile = /\.csv$/i.test(file.name); count(); };
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      const names = parseList(f.names.value, fromFile);
      if (!names.length) return toast("Paste at least one name", true);
      const r = await act(ev.submitter, () => api("POST", `${f.dataset.bulk}/bulk`, { names }));
      const skipped = r.skipped.length ? ` Skipped ${r.skipped.length}: ${r.skipped.slice(0, 4).map((s) => `${s.name} (${s.reason})`).join(", ")}${r.skipped.length > 4 ? "…" : ""}` : "";
      toast(`Added ${r.created.length} ${f.dataset.label}.${skipped}`);
      reload();
    };
  });
  $$("[data-del]", el).forEach((b) => b.onclick = async () => { if (!confirm("Remove this item?")) return; await act(b, () => api("DELETE", b.dataset.del), "Removed"); reload(); });
  $$("[data-quota]", el).forEach((i) => i.onchange = () => act(i, () => api("PATCH", `/api/leave-types/${i.dataset.quota}`, { yearly_quota: i.value === "" ? null : Number(i.value) }), "Quota updated"));
  const std = $("#std"); if (std) std.onclick = async () => { await act(std, () => api("POST", "/api/leave-types/standard"), "Standard leave types added"); reload(); };
  $("#ltf").onsubmit = async (ev) => { ev.preventDefault(); const d = formData(ev.target); await act(ev.submitter, () => api("POST", "/api/leave-types", { code: d.code, name: d.name, yearly_quota: d.yearly_quota === "" ? null : Number(d.yearly_quota), is_paid: !!d.is_paid }), "Leave type added"); reload(); };
  $("#hf").onsubmit = async (ev) => { ev.preventDefault(); await act(ev.submitter, () => api("POST", "/api/holidays", formData(ev.target)), "Holiday added"); reload(); };
};

/* ============================================================== logins (Admin) */
PAGES.users = async (el) => {
  if (!DEPTS) await lookups();
  const users = await api("GET", "/api/users");
  el.innerHTML = html`<section class="panel"><div class="panel-head"><h2>Logins</h2><button class="btn primary" id="addhr">Create HR login</button></div>
    <p class="small muted" style="margin-bottom:12px">Employee logins are created by HR when they register someone. You can deactivate any login or reset its password.</p>
    <div class="tbl-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Last sign-in</th><th>Status</th><th></th></tr></thead><tbody>
    ${users.map((u) => html`<tr><td>${u.full_name}<div class="tiny muted">${u.email}</div></td><td>${u.role === "hr" ? "HR" : u.role[0].toUpperCase() + u.role.slice(1)}</td><td class="small">${fmtDT(u.last_login_at)}</td><td>${pill(u.is_active ? "active" : "exited")}${u.must_change_password ? html` <span class="tiny muted">temporary password</span>` : ""}</td>
      <td class="r">${u.role !== "admin" ? html`<button class="btn sm" data-reset="${u.id}">Reset password</button> <button class="btn sm ${u.is_active ? "danger" : ""}" data-toggle="${u.id}" data-on="${u.is_active ? 1 : 0}">${u.is_active ? "Deactivate" : "Activate"}</button>` : ""}</td></tr>`)}</tbody></table></div></section>`;
  $("#addhr").onclick = () => employeeForm(null, () => PAGES.users(el), { hrLogin: true });
  $$("[data-toggle]", el).forEach((b) => b.onclick = async () => { await act(b, () => api("POST", `/api/users/${b.dataset.toggle}/${b.dataset.on === "1" ? "deactivate" : "activate"}`), b.dataset.on === "1" ? "Login deactivated" : "Login activated"); PAGES.users(el); });
  $$("[data-reset]", el).forEach((b) => b.onclick = async () => {
    if (!confirm("Reset this password? The person will be signed out and must set a new one.")) return;
    const r = await act(b, () => api("POST", `/api/users/${b.dataset.reset}/reset-password`));
    modal(html`<h2>Password reset</h2><dl class="kv" style="margin-top:12px"><dt>Email</dt><dd>${r.email}</dd><dt>Temporary password</dt><dd class="num"><b>${r.temporary_password}</b></dd></dl><p class="small" style="margin-top:10px">Shown once. Share it privately.</p><div style="text-align:right;margin-top:12px"><button class="btn primary" data-close>Done</button></div>`);
    PAGES.users(el);
  });
};

/* ============================================================== announcements, audit, profile */
PAGES.announcements = async (el) => {
  const items = await api("GET", "/api/announcements");
  const canPost = role() !== "employee";
  el.innerHTML = html`${canPost ? html`<section class="panel"><h2 style="margin-bottom:12px">Post an announcement</h2><form class="form" id="af"><label class="wide">Title<input name="title" required minlength="2" maxlength="200"></label><label class="wide">Message<textarea name="body" required></textarea></label><div><button class="btn primary">Post</button></div></form></section>` : ""}
    <section class="panel">${announcementsList(items)}</section>`;
  if (canPost) $("#af").onsubmit = async (ev) => { ev.preventDefault(); await act(ev.submitter, () => api("POST", "/api/announcements", formData(ev.target)), "Announcement posted"); PAGES.announcements(el); };
};
PAGES.audit = async (el, state = { page: 1 }) => {
  const d = await api("GET", "/api/audit?" + new URLSearchParams(clean({ entity: state.entity, action: state.action, page: state.page, size: 25 })));
  const pages = Math.max(1, Math.ceil(d.total / d.size));
  el.innerHTML = html`<section class="panel"><div class="panel-head"><form class="filters" id="auf"><label>Entity<input name="entity" value="${state.entity || ""}" placeholder="leave_request"></label><label>Action<select name="action">${raw(["", "create", "update", "approve", "reject", "finalize", "cancel", "deactivate", "reset_password", "delete", "import"].map((a) => `<option ${a === (state.action || "") ? "selected" : ""} value="${a}">${a || "All"}</option>`).join(""))}</select></label><button class="btn">Filter</button></form><span class="small muted">Entries can't be edited or deleted</span></div>
    <div class="tbl-wrap"><table><thead><tr><th>When</th><th>Who</th><th>Action</th><th>Entity</th><th>Before</th><th>After</th></tr></thead><tbody>
    ${d.items.map((a) => html`<tr><td class="small">${fmtDT(a.created_at)}</td><td>${a.actor_role}${a.actor_user_id ? html`<div class="tiny muted">user #${a.actor_user_id}</div>` : ""}</td><td>${a.action}</td><td>${a.entity}${a.entity_id ? " #" + a.entity_id : ""}</td>
      <td>${a.before ? html`<details><summary class="small">View</summary><pre class="json">${JSON.stringify(a.before, null, 1)}</pre></details>` : "—"}</td><td>${a.after ? html`<details><summary class="small">View</summary><pre class="json">${JSON.stringify(a.after, null, 1)}</pre></details>` : "—"}</td></tr>`)}</tbody></table></div>
    <div class="pager"><span class="small muted">${d.total} entries</span><button class="btn sm" id="prev" ${raw(state.page <= 1 ? "disabled" : "")}>Previous</button><span class="small">Page ${state.page} of ${pages}</span><button class="btn sm" id="next" ${raw(state.page >= pages ? "disabled" : "")}>Next</button></div></section>`;
  $("#auf").onsubmit = (ev) => { ev.preventDefault(); PAGES.audit(el, { ...formData(ev.target), page: 1 }); };
  $("#prev").onclick = () => PAGES.audit(el, { ...state, page: state.page - 1 });
  $("#next").onclick = () => PAGES.audit(el, { ...state, page: state.page + 1 });
};
PAGES.profile = async (el) => {
  const p = await api("GET", "/api/me/profile");
  el.innerHTML = html`<div class="grid2" style="margin-top:0"><section class="panel"><h2 style="margin-bottom:12px">${p.full_name || S.user.full_name}</h2>
      ${p.employee_code ? html`<dl class="kv"><dt>Code</dt><dd>${p.employee_code}</dd><dt>Email</dt><dd>${p.email}</dd><dt>Department</dt><dd>${p.department.name}</dd><dt>Designation</dt><dd>${p.designation?.name || "—"}</dd><dt>Joined</dt><dd>${fmtDate(p.join_date)}</dd></dl>
      <form class="form" id="pf" style="margin-top:16px"><label>Phone<input name="phone" value="${p.phone || ""}" maxlength="40"></label><label class="wide">Address<input name="address" value="${p.address || ""}" maxlength="300"></label><div><button class="btn primary">Save contact details</button></div></form>
      <p class="tiny muted" style="margin-top:8px">Other details are managed by HR.</p>` : html`<p class="muted">Admin accounts don't have an employee profile.</p>`}</section>
    <section class="panel"><h2 style="margin-bottom:12px">Security</h2><p class="small muted" style="margin-bottom:12px">Changing your password signs out your other sessions. If you signed in on a shared computer, sign out everywhere.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#/password">Change password</a><button class="btn danger" id="outall" type="button">Sign out everywhere</button></div></section></div>`;
  $("#outall").onclick = async () => { if (confirm("Sign out of HCM Lite on every device?")) await logout(false, { everywhere: true }); };
  const f = $("#pf"); if (f) f.onsubmit = async (ev) => { ev.preventDefault(); await act(ev.submitter, () => api("PATCH", "/api/me/profile", formData(ev.target)), "Contact details saved"); };
};

render();
</script>
</body>
</html>
